apiVersion: v1
kind: Secret
metadata:
  name: chrono-byos-gcs
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: byos
    app.kubernetes.io/managed-by: ops
  annotations:
    chrono.dev/byos-provider: gcs
type: Opaque
stringData:
  # Required: GCS bucket name for tenant portability pack storage.
  CHRONO_STORAGE_GCS_BUCKET: "REPLACE_ME-chrono-exports"

  # Optional: object prefix within the bucket.
  CHRONO_STORAGE_GCS_PREFIX: "chrono/"

  # Use Workload Identity (recommended for GKE). Leave empty.
  # Only populate for service account JSON key (non-GKE or legacy auth).
  CHRONO_STORAGE_GCS_SERVICE_ACCOUNT_JSON: ""

  # Optional: customer-managed encryption key resource name (CMEK).
  # Format: projects/<proj>/locations/<loc>/keyRings/<ring>/cryptoKeys/<key>
  CHRONO_STORAGE_GCS_KMS_KEY_NAME: ""
