apiVersion: v1
kind: Secret
metadata:
  name: chrono-byok-gcp-kms
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: byok
    app.kubernetes.io/managed-by: ops
  annotations:
    chrono.dev/byok-provider: gcp_kms
type: Opaque
stringData:
  # Required: full resource name of the CryptoKey used for envelope encryption.
  # Format: projects/<project>/locations/<location>/keyRings/<ring>/cryptoKeys/<key>
  CHRONO_KMS_GCP_KEY_NAME: "projects/REPLACE_ME/locations/global/keyRings/chrono/cryptoKeys/tenant-dek"

  # Leave empty to use Workload Identity (recommended for GKE).
  # Only set if using a service account JSON key file (not recommended for production).
  CHRONO_KMS_GCP_SERVICE_ACCOUNT_JSON: ""
