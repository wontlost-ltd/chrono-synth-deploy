apiVersion: v1
kind: Secret
metadata:
  name: chrono-byok-vault
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: byok
    app.kubernetes.io/managed-by: ops
  annotations:
    chrono.dev/byok-provider: vault
type: Opaque
stringData:
  # Required: URL of the HashiCorp Vault instance.
  CHRONO_KMS_VAULT_ADDR: "https://vault.example.com:8200"

  # Required: path to the transit key used for envelope encryption.
  # Format: <mount>/keys/<key-name>  (default mount: transit)
  CHRONO_KMS_VAULT_TRANSIT_KEY_PATH: "transit/keys/chrono-tenant-dek"

  # Use Kubernetes auth method (recommended for K8s deployments).
  # Set ROLE to the Vault role bound to this service account.
  CHRONO_KMS_VAULT_AUTH_METHOD: "kubernetes"
  CHRONO_KMS_VAULT_K8S_ROLE: "chrono-synth"

  # Alternative: token auth (for dev/staging only, not recommended for production).
  CHRONO_KMS_VAULT_TOKEN: ""

  # Optional: Vault namespace (HCP Vault / Vault Enterprise).
  CHRONO_KMS_VAULT_NAMESPACE: ""
