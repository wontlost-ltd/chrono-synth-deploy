apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply on top of any overlay: e.g. k8s/overlays/prod + k8s/addons/byok-aws-kms
# Usage:
#   resources:
#     - ../../overlays/prod
#     - ../../addons/byok-aws-kms

resources:
  - secret.yaml

patches:
  - target:
      kind: ConfigMap
      name: backend-config
    path: configmap-patch.yaml
