apiVersion: v1
kind: Secret
metadata:
  name: chrono-byok-aws-kms
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: byok
    app.kubernetes.io/managed-by: ops
  annotations:
    # Rotate by updating AWS_KMS_KEY_ARN and running: kubectl rollout restart deployment/chrono-synth-os
    chrono.dev/byok-provider: aws_kms
type: Opaque
stringData:
  # Required: ARN of the customer-managed CMK used to wrap data encryption keys.
  # Format: arn:aws:kms:<region>:<account-id>:key/<key-id>
  CHRONO_KMS_AWS_KEY_ARN: "arn:aws:kms:us-east-1:123456789012:key/REPLACE_ME"

  # Optional: explicit region override (defaults to instance metadata / AWS_DEFAULT_REGION env)
  CHRONO_KMS_AWS_REGION: "us-east-1"

  # Leave empty to use the Pod's IAM role (recommended for EKS with IRSA).
  # Only set if using static credentials (not recommended for production).
  CHRONO_KMS_AWS_ACCESS_KEY_ID: ""
  CHRONO_KMS_AWS_SECRET_ACCESS_KEY: ""
