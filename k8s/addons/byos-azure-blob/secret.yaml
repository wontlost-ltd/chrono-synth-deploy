apiVersion: v1
kind: Secret
metadata:
  name: chrono-byos-azure-blob
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: byos
    app.kubernetes.io/managed-by: ops
  annotations:
    chrono.dev/byos-provider: azure_blob
type: Opaque
stringData:
  # Required: Azure Storage account name.
  CHRONO_STORAGE_AZURE_ACCOUNT_NAME: "REPLACE_ME"

  # Required: container name within the storage account.
  CHRONO_STORAGE_AZURE_CONTAINER: "chrono-exports"

  # Optional: blob prefix within the container.
  CHRONO_STORAGE_AZURE_PREFIX: "chrono/"

  # Use Managed Identity (recommended for AKS). Leave connection string empty.
  CHRONO_STORAGE_AZURE_USE_MANAGED_IDENTITY: "true"
  CHRONO_STORAGE_AZURE_TENANT_ID: "REPLACE_ME"

  # Only set if NOT using managed identity (connection string or SAS token).
  CHRONO_STORAGE_AZURE_CONNECTION_STRING: ""
  CHRONO_STORAGE_AZURE_SAS_TOKEN: ""

  # Optional: reference to a customer-managed key in Azure Key Vault for blob encryption.
  CHRONO_STORAGE_AZURE_CMK_KEY_URI: ""
