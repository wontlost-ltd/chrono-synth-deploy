#     kubectl create secret generic alertmanager-secrets \
#       -n chrono-synth \
#       --from-literal=SLACK_WEBHOOK_URL='https://hooks.slack.com/services/...' \
#       --dry-run=client -o yaml | kubectl apply -f -
