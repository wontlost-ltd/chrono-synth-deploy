# Strategic merge patch — adds the Chrono SLO dashboard
# (chrono-slo.json) to grafana via its own ConfigMap volume + subPath
# mount. Keeps the per-dashboard mount pattern that base/grafana/
# deployment.yaml uses.
#
# The grafana-dashboard-chrono-slo ConfigMap is generated by this
# addon's kustomization.yaml from dashboards/chrono-slo.json. The
# JSON lives inside this addon (not under base/grafana/dashboards/)
# because kustomize Components forbid file references walking out
# of the addon root (security check).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: chrono-synth
spec:
  template:
    spec:
      containers:
        - name: grafana
          volumeMounts:
            - name: dashboard-slo
              mountPath: /var/lib/grafana/dashboards/chrono-slo.json
              subPath: chrono-slo.json
      volumes:
        - name: dashboard-slo
          configMap:
            name: grafana-dashboard-chrono-slo
