apiVersion: v1
kind: Secret
metadata:
  name: chrono-byok-azure-kv
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: byok
    app.kubernetes.io/managed-by: ops
  annotations:
    chrono.dev/byok-provider: azure_kv
type: Opaque
stringData:
  # Required: fully-qualified URI of the Key Vault key (including version for pinned rotation).
  # Format: https://<vault-name>.vault.azure.net/keys/<key-name>/<key-version>
  CHRONO_KMS_AZURE_KEY_ID: "https://REPLACE_ME.vault.azure.net/keys/chrono-tenant-dek/REPLACE_VERSION"

  # Required: Azure tenant ID (AAD directory ID).
  CHRONO_KMS_AZURE_TENANT_ID: "REPLACE_ME"

  # Use Managed Identity (recommended for AKS with pod identity / workload identity).
  # Leave CLIENT_ID/SECRET empty and set USE_MANAGED_IDENTITY=true.
  CHRONO_KMS_AZURE_USE_MANAGED_IDENTITY: "true"

  # Only set if NOT using managed identity (service principal credentials).
  CHRONO_KMS_AZURE_CLIENT_ID: ""
  CHRONO_KMS_AZURE_CLIENT_SECRET: ""
