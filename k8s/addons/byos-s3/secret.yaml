apiVersion: v1
kind: Secret
metadata:
  name: chrono-byos-s3
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: byos
    app.kubernetes.io/managed-by: ops
  annotations:
    chrono.dev/byos-provider: s3
type: Opaque
stringData:
  # Required: S3 bucket name for tenant portability pack storage.
  CHRONO_STORAGE_S3_BUCKET: "REPLACE_ME-chrono-exports"

  # Required: AWS region where the bucket lives.
  CHRONO_STORAGE_S3_REGION: "us-east-1"

  # Optional: custom endpoint for S3-compatible stores (MinIO, Ceph, DigitalOcean Spaces).
  CHRONO_STORAGE_S3_ENDPOINT: ""

  # Optional: path prefix within the bucket (useful for shared buckets).
  CHRONO_STORAGE_S3_PREFIX: "chrono/"

  # Use IAM role / IRSA (recommended for EKS). Leave credentials empty.
  # Only populate for static credentials (non-AWS S3-compatible stores).
  CHRONO_STORAGE_S3_ACCESS_KEY_ID: ""
  CHRONO_STORAGE_S3_SECRET_ACCESS_KEY: ""

  # Optional: reference to a KMS key for server-side encryption of objects.
  CHRONO_STORAGE_S3_SSE_KMS_KEY_ID: ""
