apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chrono-synth
  annotations:
    # ArgoCD sync wave 0: Data tier service — see statefulset.
    argocd.argoproj.io/sync-wave: '0'
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
