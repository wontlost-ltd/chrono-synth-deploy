apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-worker
  namespace: chrono-synth
  annotations:
    # ArgoCD sync wave 5: Business tier — consumes ledger from backend.
    argocd.argoproj.io/sync-wave: '5'
  labels:
    app.kubernetes.io/name: observability-worker
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-worker
        app.kubernetes.io/component: observability
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observability-worker
          image: ghcr.io/wontlost-ltd/chrono-synth-os:latest
          command: ["node", "dist/main-observability-worker.js"]
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          env:
            - name: CHRONO_REDIS_ENABLED
              value: "false"
            - name: CHRONO_QUEUE_ENABLED
              value: "false"
            - name: CHRONO_OTEL_SERVICE_NAME
              value: chrono-synth-observability-worker
            - name: CHRONO_OBSERVABILITY_WORKER_ENABLED
              value: "true"
            - name: CHRONO_OBSERVABILITY_WORKER_HTTP_ENABLED
              value: "true"
            - name: CHRONO_OBSERVABILITY_WORKER_HTTP_HOST
              value: 0.0.0.0
            - name: CHRONO_OBSERVABILITY_WORKER_HTTP_PORT
              value: "3100"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
