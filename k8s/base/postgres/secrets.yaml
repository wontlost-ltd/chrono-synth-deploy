apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: chrono-synth
  annotations:
    # ArgoCD sync wave -5: Postgres credentials must exist before the postgres pod starts.
    argocd.argoproj.io/sync-wave: '-5'
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_USE_openssl_rand_hex_16"
