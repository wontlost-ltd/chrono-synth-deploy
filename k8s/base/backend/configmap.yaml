apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: backend
data:
  CHRONO_DB_DRIVER: "postgres"
  CHRONO_LOG_LEVEL: "info"
  CHRONO_LOG_JSON: "true"
  CHRONO_SERVER_HOST: "0.0.0.0"
  CHRONO_SERVER_PORT: "3000"
  CHRONO_CORS_ORIGIN: "https://chrono.example.com"
  CHRONO_CORS_CREDENTIALS: "true"
  CHRONO_AUTH_ENABLED: "true"
  CHRONO_AUTH_REQUIRE_DB_KEYS: "true"
  CHRONO_JWT_ENABLED: "true"
  CHRONO_REDIS_ENABLED: "true"
  CHRONO_REDIS_URL: "redis://redis:6379"
  CHRONO_QUEUE_ENABLED: "true"
  CHRONO_WEBSOCKET_ENABLED: "true"
  CHRONO_WEBSOCKET_HEARTBEAT_MS: "30000"
  CHRONO_RATE_LIMIT_MAX: "100"
  CHRONO_RATE_LIMIT_WINDOW_MS: "60000"
  CHRONO_REQUEST_TIMEOUT_MS: "30000"
  CHRONO_REQUEST_MAX_BODY_BYTES: "1048576"
  CHRONO_OTEL_ENABLED: "true"
  CHRONO_OTEL_ENDPOINT: "http://jaeger:4318"
  CHRONO_SERVER_PUBLIC_URL: "https://chrono.example.com"
  CHRONO_ENCRYPTION_ENABLED: "true"
  CHRONO_ENCRYPTION_DEFAULT_KEY_REF: "master"
  CHRONO_OBSERVABILITY_WORKER_ENABLED: "false"
  CHRONO_OBSERVABILITY_KAFKA_ENABLED: "false"
  CHRONO_OBSERVABILITY_KAFKA_TOPIC: "observability.events"
  CHRONO_OBSERVABILITY_KAFKA_CONSUMER_GROUP_ID: "chrono-synth-observability"
  CHRONO_OBSERVABILITY_KAFKA_STARTUP_WAIT_MS: "45000"
  CHRONO_INTELLIGENCE_PROVIDER: "mock"
  CHRONO_STRIPE_ENABLED: "false"
  # 数据平面权威模式：tables_primary | dual_write | ledger_primary | rollback_tables
  # 通过 Admin API per-tenant 精细控制，此处为新租户默认值
  CHRONO_DATA_PLANE_AUTHORITY_MODE: "tables_primary"
  # KMS 提供方：platform | aws_kms | gcp_kms | azure_kv | vault
  CHRONO_KMS_PROVIDER: "platform"
  # 对象存储提供方：platform | s3 | gcs | azure_blob | local
  CHRONO_STORAGE_PROVIDER: "platform"
