apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  CHRONO_DB_CONNECTION_STRING: "postgresql://chrono:CHANGE_ME@postgres:5432/chrono_synth"
  CHRONO_JWT_SECRET: "CHANGE_ME_USE_openssl_rand_hex_32"
  CHRONO_ENCRYPTION_MASTER_KEY: "CHANGE_ME_USE_openssl_rand_base64_32"
  CHRONO_ENCRYPTION_KEYRING_JSON: "{}"
  CHRONO_OBSERVABILITY_KAFKA_BROKERS: "kafka-bootstrap.kafka.svc.cluster.local:9092"
  CHRONO_OBSERVABILITY_KAFKA_USERNAME: ""
  CHRONO_OBSERVABILITY_KAFKA_PASSWORD: ""
  CHRONO_STRIPE_SECRET_KEY: ""
  CHRONO_STRIPE_WEBHOOK_SECRET: ""
  CHRONO_INTELLIGENCE_API_KEY: ""
  # ── P3 Agent 工具凭据 ─────────────────────────────────────────
  # WebSearch provider API key（exa / serper 等）
  CHRONO_AGENT_WEB_SEARCH_API_KEY: ""
  # Google service-account JSON（calendar / gmail），用于无用户级 OAuth 的兜底；建议留空走用户级 OAuth
  CHRONO_AGENT_CALENDAR_SERVICE_ACCOUNT_JSON: ""
  CHRONO_AGENT_CALENDAR_OAUTH_ACCESS_TOKEN: ""
  CHRONO_AGENT_EMAIL_SERVICE_ACCOUNT_JSON: ""
  CHRONO_AGENT_EMAIL_OAUTH_ACCESS_TOKEN: ""
  # Google OAuth client（用户级 OAuth 流程）
  CHRONO_AGENT_OAUTH_GOOGLE_CLIENT_ID: ""
  CHRONO_AGENT_OAUTH_GOOGLE_CLIENT_SECRET: ""
  # ── T0-B 漂移告警 webhook 共享密钥 ────────────────────────────
  # 非空时随告警请求以 X-Chrono-Webhook-Secret 头发送
  CHRONO_SAFETY_ALERTS_WEBHOOK_SECRET: ""
