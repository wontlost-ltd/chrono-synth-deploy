apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  CHRONO_DB_CONNECTION_STRING: "postgresql://chrono:CHANGE_ME@postgres:5432/chrono_synth"
  CHRONO_JWT_SECRET: "CHANGE_ME_USE_openssl_rand_hex_32"
  CHRONO_ENCRYPTION_MASTER_KEY: "CHANGE_ME_USE_openssl_rand_base64_32"
  CHRONO_ENCRYPTION_KEYRING_JSON: "{}"
  CHRONO_OBSERVABILITY_KAFKA_BROKERS: "kafka-bootstrap.kafka.svc.cluster.local:9092"
  CHRONO_OBSERVABILITY_KAFKA_USERNAME: ""
  CHRONO_OBSERVABILITY_KAFKA_PASSWORD: ""
  CHRONO_STRIPE_SECRET_KEY: ""
  CHRONO_STRIPE_WEBHOOK_SECRET: ""
  CHRONO_INTELLIGENCE_API_KEY: ""
