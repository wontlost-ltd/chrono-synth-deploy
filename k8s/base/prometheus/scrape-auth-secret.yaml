apiVersion: v1
kind: Secret
metadata:
  name: prometheus-scrape-auth
  namespace: chrono-synth
  annotations:
    # ArgoCD sync wave -5: Bearer token must exist before prometheus scrapes backend.
    argocd.argoproj.io/sync-wave: '-5'
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
type: Opaque
stringData:
  token: "CHANGE_ME_use_a_long_random_metrics_scrape_token"
