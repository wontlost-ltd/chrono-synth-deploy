# 环境: k8s — 模板见 ../../../prometheus-scrape-jobs.yml.tpl
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: chrono-synth-backend
    metrics_path: /metrics/prometheus
    bearer_token_file: /etc/prometheus/secrets/metrics-scrape-token/token
    static_configs:
      - targets:
          - chrono-synth-os:3000
        labels:
          service: chrono-synth-os
          environment: k8s

  - job_name: chrono-synth-observability-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - observability-worker:3100
        labels:
          service: observability-worker
          environment: k8s

  - job_name: prometheus-self
    static_configs:
      - targets:
          - localhost:9090
        labels:
          environment: k8s
