apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: chrono-synth
  annotations:
    # ArgoCD sync wave 10: Prometheus service — see deployment.
    argocd.argoproj.io/sync-wave: '10'
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
