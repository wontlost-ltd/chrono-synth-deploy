apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: chrono-synth
  annotations:
    # ArgoCD sync wave 10: Reads from prometheus + jaeger.
    argocd.argoproj.io/sync-wave: '10'
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: provisioning-datasources.yml
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: provisioning-dashboards.yml
            # Each dashboard JSON is mounted via its own subPath into
            # /var/lib/grafana/dashboards. The grafana file provider
            # picks up everything in that directory. Adding a new
            # dashboard = (configMapGenerator entry) + (volume) +
            # (volumeMount with subPath). The SLO dashboard is added
            # via the observability-slo addon (staging/prod only) and
            # therefore is not in this base manifest.
            - name: dashboard-enterprise-overview
              mountPath: /var/lib/grafana/dashboards/chrono-synth-enterprise-overview.json
              subPath: chrono-synth-enterprise-overview.json
            # readOnlyRootFilesystem requires writable /tmp for runtime work
            # (plugin downloads, image rendering scratch).
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-enterprise-overview
          configMap:
            name: grafana-dashboard-chrono-synth-overview
