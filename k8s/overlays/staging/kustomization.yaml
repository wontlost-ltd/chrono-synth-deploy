apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# SLO monitoring (kustomize Component): SLI recording rules,
# multi-window burn-rate alerts, alertmanager Slack receiver, Chrono
# SLO grafana dashboard. Dev does not include this Component — see
# addon kustomization.yaml for rationale.
components:
  - ../../addons/observability-slo

patches:
  # 后端：单副本
  - target:
      kind: Deployment
      name: chrono-synth-os
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # 前端：单副本
  - target:
      kind: Deployment
      name: chrono-synth-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Ingress：staging 域名
  - target:
      kind: Ingress
      name: chrono-synth-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: chrono.staging.local
  - target:
      kind: Deployment
      name: prometheus
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: --web.external-url=https://chrono.staging.local/prometheus/

  # ConfigMap：staging 环境覆盖
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |
      - op: replace
        path: /data/CHRONO_LOG_LEVEL
        value: "info"
      - op: replace
        path: /data/CHRONO_CORS_ORIGIN
        value: "https://chrono.staging.local"
      - op: replace
        path: /data/CHRONO_SERVER_PUBLIC_URL
        value: "https://chrono.staging.local"
      - op: replace
        path: /data/CHRONO_AUTH_ENABLED
        value: "true"
      - op: replace
        path: /data/CHRONO_AUTH_REQUIRE_DB_KEYS
        value: "true"
      - op: replace
        path: /data/CHRONO_ENCRYPTION_ENABLED
        value: "true"
      - op: replace
        path: /data/CHRONO_OBSERVABILITY_KAFKA_ENABLED
        value: "true"
  - target:
      kind: ConfigMap
      name: frontend-config
    patch: |
      - op: replace
        path: /data/CHRONO_WEB_ENVIRONMENT
        value: "staging"
