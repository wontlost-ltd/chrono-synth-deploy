# ChronoSynth 本地 podman 容器化测试
# 使用方法：
#   cd podman
#   cp .env.example .env  # 修改配置
#   podman-compose up -d
#   podman-compose logs -f backend

services:
  backend:
    image: ghcr.io/rpang/chrono-synth-os:latest
    build:
      context: ../../chrono-synth-os
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - CHRONO_DB_DRIVER=postgres
      - CHRONO_DB_CONNECTION_STRING=postgresql://chrono:${PG_PASSWORD:-chrono_dev}@postgres:5432/chrono_synth
      - CHRONO_LOG_LEVEL=${LOG_LEVEL:-info}
      - CHRONO_LOG_JSON=true
      - CHRONO_SERVER_HOST=0.0.0.0
      - CHRONO_SERVER_PORT=3000
      - CHRONO_CORS_ORIGIN=true
      - CHRONO_CORS_CREDENTIALS=true
      - CHRONO_AUTH_ENABLED=false
      - CHRONO_JWT_ENABLED=${JWT_ENABLED:-true}
      - CHRONO_JWT_SECRET=${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      - CHRONO_REDIS_ENABLED=true
      - CHRONO_REDIS_URL=redis://redis:6379
      - CHRONO_QUEUE_ENABLED=true
      - CHRONO_OTEL_ENABLED=${OTEL_ENABLED:-true}
      - CHRONO_OTEL_ENDPOINT=http://jaeger:4318
      - CHRONO_INTELLIGENCE_PROVIDER=${INTELLIGENCE_PROVIDER:-mock}
      - CHRONO_INTELLIGENCE_API_KEY=${INTELLIGENCE_API_KEY:-}
      - CHRONO_STRIPE_ENABLED=false
      - CHRONO_WEBSOCKET_ENABLED=true
      - CHRONO_WEBSOCKET_HEARTBEAT_MS=30000
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - chrono-net

  frontend:
    image: ghcr.io/rpang/chrono-synth-web:latest
    build:
      context: ../../chrono-synth-web
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - chrono-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chrono_synth
      POSTGRES_USER: chrono
      POSTGRES_PASSWORD: ${PG_PASSWORD:-chrono_dev}
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chrono -d chrono_synth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chrono-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - chrono-net

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "${JAEGER_PORT:-16686}:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - chrono-net

volumes:
  pg-data:
    driver: local
  redis-data:
    driver: local

networks:
  chrono-net:
    driver: bridge
