apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chrono-synth.fullname" . }}-backend
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chrono-synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "chrono-synth.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: chrono-synth-os
          image: {{ include "chrono-synth.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.backend.containerSecurityContext | nindent 12 }}
          env:
            {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: CHRONO_DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalServices.postgres.secretName }}
                  key: {{ .Values.externalServices.postgres.secretKey }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalServices.redis.secretName }}
                  key: {{ .Values.externalServices.redis.secretKey }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chrono-synth.fullname" . }}-backend
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chrono-synth.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
