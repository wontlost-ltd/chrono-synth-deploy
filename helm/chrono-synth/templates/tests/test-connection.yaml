apiVersion: v1
kind: Pod
metadata:
  name: {{ include "chrono-synth.fullname" . }}-test-connection
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chrono-synth.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          set -eu
          backend_url="http://{{ include "chrono-synth.fullname" . }}-backend:{{ .Values.backend.service.port }}"
          frontend_url="http://{{ include "chrono-synth.fullname" . }}-frontend:{{ .Values.frontend.service.port }}"

          echo "checking backend healthz..."
          curl -fsS --max-time 10 "$backend_url/healthz"
          echo

          echo "checking frontend healthz..."
          curl -fsS --max-time 10 "$frontend_url/frontend-healthz"
          echo

          echo "all checks passed"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
