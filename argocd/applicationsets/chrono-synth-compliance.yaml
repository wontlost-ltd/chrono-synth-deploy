# GA Sprint 3 Step 7 — Kyverno ClusterPolicy deployment via ArgoCD.
#
# The Kyverno policies in compliance/kyverno/policies/ enforce supply-chain
# + workload hardening across every namespace. They are ClusterPolicies,
# so they apply globally regardless of which app namespace a workload
# lands in. We deploy them through their own ApplicationSet (one
# Application per cluster) instead of folding them into the chrono-synth
# overlays for three reasons:
#
#   1. Lifecycle decoupling — policies survive when individual app
#      Applications are torn down. A prod app delete should never
#      accidentally remove the verify-image-signature ClusterPolicy.
#
#   2. Multi-cluster fan-out — the cluster generator deploys the same
#      policy set to every registered cluster, so we don't have to
#      replicate it inside per-cluster overlays.
#
#   3. Auto-sync everywhere — production policy changes go through PR
#      review and CODEOWNERS, but once merged they MUST converge in
#      seconds, including prod. Compliance drift defeats the control.
#      A separate AppProject (chrono-synth-compliance) confines who can
#      open such PRs.
#
# Prerequisites:
#   - Kyverno operator installed in the cluster (argocd/install/ chart).
#   - ArgoCD cluster registry has each target cluster registered with
#     label `compliance.chrono-synth.io/enabled=true`. This is a
#     positive opt-in selector — Kubernetes set-based NotIn matches
#     missing labels, which would otherwise pull in the local argocd
#     control-plane cluster too.
#   - The `chrono-synth-compliance` AppProject exists; see
#     argocd/projects/chrono-synth-compliance.yaml.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: chrono-synth-compliance
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']

  generators:
    - clusters:
        # Positive opt-in selector. Each target cluster must be
        # registered with `compliance.chrono-synth.io/enabled=true`.
        # This is safer than NotIn(exempt=true) because Kubernetes
        # set-based selectors treat missing keys as matching NotIn,
        # which would silently include every unlabeled cluster
        # including the local argocd control plane.
        selector:
          matchLabels:
            compliance.chrono-synth.io/enabled: 'true'

  template:
    metadata:
      # `{{.name}}` is the ArgoCD cluster-generator injected cluster
      # name (in-cluster / prod-us-west / ...).
      name: 'chrono-synth-compliance-{{.name}}'
      labels:
        app.kubernetes.io/name: chrono-synth-compliance
        app.kubernetes.io/part-of: chrono-synth
        cluster: '{{.name}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      # Dedicated project: confines who can change compliance + which
      # cluster-scoped resources may be deployed. See
      # argocd/projects/chrono-synth-compliance.yaml.
      project: chrono-synth-compliance

      source:
        repoURL: https://github.com/wontlost-ltd/chrono-synth-deploy.git
        targetRevision: main
        path: compliance/kyverno/policies
        # No kustomize patches — policies are ClusterPolicy and have the
        # same shape across clusters.

      destination:
        server: '{{.server}}'
        # ClusterPolicy is cluster-scoped, but Argo uses the destination
        # namespace as the default for any namespaced helpers (e.g.
        # a future ConfigMap). `kyverno` is the conventional namespace.
        namespace: kyverno

      syncPolicy:
        automated:
          # All clusters auto-sync + selfHeal — compliance must converge
          # immediately. PR review + CODEOWNERS gate WHAT lands in git;
          # ArgoCD then propagates uniformly.
          # prune=false is deliberate: a policy file removed from git
          # stays in the cluster until the security-operator runs an
          # explicit `argocd app sync --prune` after review. This makes
          # accidental policy deletion impossible to ship unnoticed.
          prune: false
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m

      revisionHistoryLimit: 20

  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false
