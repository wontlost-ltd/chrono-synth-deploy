name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 04:00 UTC for drift detection on supply-chain CVEs
    # leaking into helm values / k8s manifests / runbooks.
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  # Pinned to GitHub-hosted Ubuntu: trufflesecurity/trufflehog@main runs
  # via `docker run`, and our macOS self-hosted runner uses podman without
  # a `docker` CLI shim (same constraint as chrono-synth-os/web).
  secrets-scan:
    name: Secrets scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so trufflehog can scan past commits — deploy repo
          # has historically held helm values + k8s secrets stubs that may
          # have leaked credentials in earlier revisions.
          fetch-depth: 0
      - name: TruffleHog filesystem scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown
