name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install kustomize
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- 5.4.3 /usr/local/bin
      - name: Shell syntax
        run: |
          bash -n deploy.sh
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate Kustomize overlays
        run: ./scripts/validate-k8s.sh
      - name: Portability conformance (offline / schema)
        run: bash scripts/portability-conformance.sh --offline
