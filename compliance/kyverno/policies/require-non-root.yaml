apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Pods must runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: |
      Containers running as root inherit broader kernel capabilities. Set
      runAsNonRoot=true at the pod or container level. Maps to PSA-restricted.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: Pods must set securityContext.runAsNonRoot=true (pod or container scope).
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: "true"
              containers:
                - =(securityContext):
                    =(runAsNonRoot): "true"
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: "true"
