apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU + memory limits
    policies.kyverno.io/category: Resource governance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: |
      Pods without limits can DOS a node. Requesting limits is the simplest
      defense and informs HPA + cluster-autoscaler decisions. Maps to
      CIS 5.7.1 + the chrono-synth capacity plan (docs/operations/capacity-planning.md).
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: cpu-and-memory-limits
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        # 系统命名空间不强制；运营方控制
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease]
      validate:
        message: Containers must declare resources.limits.cpu and resources.limits.memory.
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
