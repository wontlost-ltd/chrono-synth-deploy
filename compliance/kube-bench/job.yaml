# kube-bench — CIS Kubernetes Benchmark scanner.
#
# Runs as a one-shot Job (RunOnce). Schedules can wrap this in a CronJob
# (see ../evidence/cronjob.yaml) for monthly evidence collection.
#
# Output: results stream to stdout in JSON. The evidence cronjob picks
# them up and uploads to S3 for compliance retention.
#
# Apply: `kubectl apply -f compliance/kube-bench/job.yaml`
# Inspect: `kubectl logs -n compliance job/kube-bench`

apiVersion: v1
kind: Namespace
metadata:
  name: compliance
  labels:
    pod-security.kubernetes.io/enforce: privileged
    # privileged required: kube-bench reads node filesystem + kubelet
    # config; restricted PSA blocks the hostPath mounts it needs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-bench
  namespace: compliance
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: compliance
  annotations:
    compliance.runbook: docs/operations/compliance-runbook.md#kube-bench
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400  # cleanup after 24h
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bench
    spec:
      hostPID: true
      serviceAccountName: kube-bench
      restartPolicy: Never
      containers:
        - name: kube-bench
          # Pin to a tagged release; bumping is a deliberate audit-trail event.
          image: aquasec/kube-bench:v0.10.7
          command:
            - kube-bench
            - --benchmark
            - cis-1.9
            - --json
          volumeMounts:
            - name: var-lib-etcd
              mountPath: /var/lib/etcd
              readOnly: true
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: var-lib-kube-scheduler
              mountPath: /var/lib/kube-scheduler
              readOnly: true
            - name: var-lib-kube-controller-manager
              mountPath: /var/lib/kube-controller-manager
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: lib-systemd
              mountPath: /lib/systemd/
              readOnly: true
            - name: srv-kubernetes
              mountPath: /srv/kubernetes/
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: usr-bin
              mountPath: /usr/local/mount-from-host/bin
              readOnly: true
            - name: etc-cni-netd
              mountPath: /etc/cni/net.d/
              readOnly: true
            - name: opt-cni-bin
              mountPath: /opt/cni/bin/
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0  # required for the host filesystem reads
      volumes:
        - name: var-lib-etcd
          hostPath:
            path: /var/lib/etcd
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: var-lib-kube-scheduler
          hostPath:
            path: /var/lib/kube-scheduler
        - name: var-lib-kube-controller-manager
          hostPath:
            path: /var/lib/kube-controller-manager
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
        - name: lib-systemd
          hostPath:
            path: /lib/systemd
        - name: srv-kubernetes
          hostPath:
            path: /srv/kubernetes
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
        - name: usr-bin
          hostPath:
            path: /usr/bin
        - name: etc-cni-netd
          hostPath:
            path: /etc/cni/net.d
        - name: opt-cni-bin
          hostPath:
            path: /opt/cni/bin
